# Build and publish the sidecar Docker images to GitHub Container Registry.
#
# Triggers:
#   - push to main          -> ghcr.io/.../<service>:main (and :<sha>)
#   - tag vX.Y.Z            -> ghcr.io/.../<service>:X.Y.Z and :latest
#   - manual (workflow_dispatch)
#
# After publishing, the docker-compose files pull from GHCR so users don't
# need to build locally. Enable Actions -> Settings -> Actions -> General:
#   Workflow permissions: "Read and write permissions".

name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [acoustid, webhook, proxy, mysql, radio, essentia]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          flavor: |
            latest=true

      - name: Build and push (retry 3x)
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i of 3 for ${{ matrix.service }} ==="
            docker buildx build \
              --push \
              --tag ghcr.io/${{ github.repository }}/${{ matrix.service }}:main \
              --tag ghcr.io/${{ github.repository }}/${{ matrix.service }}:sha-${GITHUB_SHA::7} \
              --tag ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest \
              ./${{ matrix.service }} && exit 0
            echo "Attempt $i failed, waiting 30s..."
            sleep 30
          done
          echo "All attempts failed"
          exit 1
