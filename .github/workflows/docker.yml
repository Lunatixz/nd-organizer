# Build sidecar Docker images and push to GHCR.
# Only triggers on code changes (not workflow file changes).
# Pruning is handled by prune.yml separately.

name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'webhook/**'
      - 'acoustid/**'
      - 'proxy/**'
      - 'mysql/**'
      - 'essentia/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'manifest.json'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [acoustid, webhook, proxy, mysql, essentia]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Retry on failure
        if: failure()
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
