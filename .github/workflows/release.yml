# Build the plugin .ndp and attach it to a GitHub Release.
#
# Release model:
#   - VERSION BUMP (push a vX.Y.Z tag): creates a release + tag for that
#     version ONLY, carrying the version-numbered .ndp. It is never touched by
#     regular commits.
#       git tag v0.2.0 && git push origin v0.2.0
#   - EVERY commit (push/squash to main): the .ndp is rebuilt and uploaded to a
#     separate "latest" release (tag: latest) via `gh release upload --clobber`,
#     so latest always matches the newest commit.
#
# The tag/dispatch path verifies manifest.version == tag/input so every
# versioned release is honest. Also runnable manually with a version input.

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match manifest.json 'version', e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wasm target
        run: rustup target add wasm32-wasip1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Host tests
        run: cargo test

      - name: Build plugin (wasm32-wasip1)
        run: cargo build --release --target wasm32-wasip1

      - name: Resolve version
        id: ver
        run: |
          MANIFEST=$(node -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            # Tag push (vX.Y.Z): version from the tag.
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # Push/squash to main: keep updating the release for the current
            # manifest version (same version = update the existing .ndp).
            echo "version=${MANIFEST}" >> "$GITHUB_OUTPUT"
            echo "tag=v${MANIFEST}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify manifest version matches the release
        run: |
          MANIFEST=$(node -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)")
          echo "manifest version: $MANIFEST"
          echo "release version: ${{ steps.ver.outputs.version }}"
          # On tag/dispatch the version must match the manifest; on main pushes
          # the version IS the manifest version, so this always passes.
          if [ "$MANIFEST" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::manifest.json version ($MANIFEST) does not match tag/input (${{ steps.ver.outputs.version }}). Bump manifest.json to match." >&2
            exit 1
          fi
          echo "version-ok=true" >> "$GITHUB_OUTPUT"

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest ok')"

      - name: Package .ndp
        run: |
          mkdir -p dist stage
          cp manifest.json stage/
          cp target/wasm32-wasip1/release/nd_organizer.wasm stage/plugin.wasm
          cd stage
          zip -q "../dist/nd-organizer-${{ steps.ver.outputs.version }}.ndp" manifest.json plugin.wasm
          cp "../dist/nd-organizer-${{ steps.ver.outputs.version }}.ndp" "../dist/nd-organizer.ndp"
          cd ..
          ls -l dist

      - name: Publish .ndp to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Version bump: (re)create the release for THIS version only.
            gh release delete "${{ steps.ver.outputs.tag }}" --yes || true
            gh release create "${{ steps.ver.outputs.tag }}" dist/*.ndp \
              --title "v${{ steps.ver.outputs.version }}" --generate-notes
          else
            # Every commit to main -> update the "latest" release (tag: latest).
            # The version release (vX.Y.Z) is untouched here.
            if gh release view latest >/dev/null 2>&1; then
              gh release upload latest dist/*.ndp --clobber
            else
              gh release create latest dist/*.ndp --title "latest" --generate-notes
            fi
          fi
