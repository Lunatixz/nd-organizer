# nd-organizer MySQL KV sidecar.
#
# Bridge that lets the plugin store its KVStore state (cache, task log, scan
# index, stats) in YOUR MySQL/MariaDB database instead of the local SQLite file
# Navidrome manages per-plugin. Connection details are read from environment
# variables below; the plugin only needs the sidecar URL.
#
# Prerequisites: a MySQL/MariaDB server reachable from this container, and a
# database + user it can write to (the `kvstore` table is created automatically).
#
# Usage:
#   docker compose -f mysql/docker-compose.yml up -d
# Then in the plugin settings set:
#   persistenceBackend = mysql
#   persistenceUrl      = http://<host>:8098
#   mysqlName/User/Password = your database connection

services:
  nd-organizer-mysql:
    image: ghcr.io/lunatixz/nd-organizer/mysql:latest
    container_name: nd-organizer-mysql
    restart: unless-stopped
    ports:
      - "8098:8098"
    environment:
      - WEBHOOK_URL=http://nd-organizer-webhook:8099   # heartbeat -> dashboard
      - MYSQL_HOST=nd-organizer-mariadb
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=navidrome
      - MYSQL_USER=navidrome
      - MYSQL_PASSWORD=navidrome
    networks:
      - stack_network

networks:
  stack_network:
    external: true
