[package]
name = "nd-organizer"
version = "0.1.0"
edition = "2021"
description = "Navidrome plugin that organizes music, refreshes tags/artwork, and triggers rescans"
license = "GPL-3.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
nd-pdk = { path = "pdk/nd-pdk" }
extism-pdk = "1.2"
lofty = "0.22"
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
